name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ------------------------------------------------------------------
      # Compact contract compilation (forced to 0.4.0 for 0.16.0 runtime)
      - name: Install Compact CLI v0.4.0
        run: |
          curl -O -s -L https://github.com/midnightntwrk/compact/releases/download/compact-v0.4.0/compact-installer.sh
          sh compact-installer.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Compile Compact contract
        run: compact compile contracts/veilcred.compact managed/veilcred

      - name: Upload compiled contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-contract
          path: managed/veilcred/

      - name: Run tests
        run: npm test

      - name: Type-check + build frontend
        run: npm run build

      - name: Lint
        run: npm run lint
