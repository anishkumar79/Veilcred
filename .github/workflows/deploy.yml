name: Deploy Veilcred to Preprod
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'preprod-deployment/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd preprod-deployment
          npm install
          npm install --no-save tsx

      - name: Copy pre-compiled contract artifacts into deployment workspace
        run: |
          # The contract is already compiled with compactc 0.19.0 and committed to the repo.
          # We just copy the managed artifacts into the location the deployment CLI expects.
          mkdir -p preprod-deployment/contracts/src/managed/bboard
          cp -r managed/veilcred/* preprod-deployment/contracts/src/managed/bboard/
          mkdir -p preprod-deployment/contracts/dist/managed/bboard
          cp -r managed/veilcred/* preprod-deployment/contracts/dist/managed/bboard/
          echo "Contract artifacts copied successfully:"
          ls -la preprod-deployment/contracts/src/managed/bboard
          ls -la preprod-deployment/contracts/src/managed/bboard/keys
          ls -la preprod-deployment/contracts/src/managed/bboard/compiler

      - name: Install contracts dependencies (with compact-runtime 0.19.0)
        run: |
          cd preprod-deployment/contracts
          npm install

      - name: Build Contract Bindings
        run: |
          cd preprod-deployment/contracts
          npm run build

      - name: Increase swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /swapfile_extra || true
          sudo fallocate -l 10G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=10240
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          free -h

      - name: Restore Wallet Database Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.midnight
            preprod-deployment/cli/bboard-private-state
            preprod-deployment/cli/wallet-state
            preprod-deployment/cli/level
            preprod-deployment/cli/.level
          key: ${{ runner.os }}-midnight-wallet-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-midnight-wallet-

      - name: Deploy Contract
        run: |
          cd preprod-deployment/cli
          npx tsx src/launcher/deploy-gatecheck.ts
        env:
          NODE_OPTIONS: "--max-old-space-size=8192 --expose-gc"
          WALLET_SEED: ${{ secrets.WALLET_SEED }}

      - name: Save Wallet Database Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.midnight
            preprod-deployment/cli/bboard-private-state
            preprod-deployment/cli/wallet-state
            preprod-deployment/cli/level
            preprod-deployment/cli/.level
          key: ${{ runner.os }}-midnight-wallet-${{ github.run_id }}

      - name: Display Deployment Results
        if: always()
        run: |
          if [ -f deployed_contract.json ]; then
            echo "::notice title=Midnight Preprod Deployment::$(cat deployed_contract.json)"
            cat deployed_contract.json
          fi

      - name: Upload Deployment Info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info
          path: |
            preprod-deployment/cli/deployment.json
            deployed_contract.json
