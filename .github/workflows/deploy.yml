name: Deploy Veilcred to Preprod
on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force re-deployment even if contract already exists'
        required: false
        default: 'true'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'preprod-deployment/**'
      - 'contracts/veilcred.compact'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd preprod-deployment
          npm install
          npm install --no-save tsx
          node infra/scripts/patch-wallet-sdk.mjs

      - name: Install contracts dependencies
        run: |
          cd preprod-deployment/contracts
          npm install

      # -----------------------------------------------------------------------
      # Compile using compact 0.31.1/0.31.0 which matches our restored dependencies
      # -----------------------------------------------------------------------
      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.compact/bin" >> $GITHUB_PATH

      - name: Compile Contract
        run: |
          compact update 0.31.1 || compact update 0.31.0
          compact --version
          mkdir -p preprod-deployment/contracts/src/managed/veilcred
          compact compile contracts/veilcred.compact preprod-deployment/contracts/src/managed/veilcred
          echo "Compiled keys:"
          ls preprod-deployment/contracts/src/managed/veilcred/keys/

      - name: Copy contract artifacts into dist workspace
        run: |
          mkdir -p preprod-deployment/contracts/dist/managed/veilcred
          cp -r preprod-deployment/contracts/src/managed/veilcred/* preprod-deployment/contracts/dist/managed/veilcred/
          echo "Contract artifacts:"
          ls preprod-deployment/contracts/src/managed/veilcred

      - name: Build Contract Bindings
        run: |
          cd preprod-deployment/contracts
          npm run build

      - name: Increase swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /swapfile_extra || true
          sudo fallocate -l 10G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=10240
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          free -h

      - name: Restore Wallet Database Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.midnight
            preprod-deployment/cli/veilcred-private-state
            preprod-deployment/cli/wallet-state
            preprod-deployment/cli/level
            preprod-deployment/cli/.level
          key: ${{ runner.os }}-midnight-wallet-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-midnight-wallet-

      - name: Deploy Contract
        run: |
          cd preprod-deployment/cli
          npx tsx src/launcher/deploy-gatecheck.ts
        env:
          NODE_OPTIONS: "--max-old-space-size=8192 --expose-gc"
          WALLET_SEED: ${{ secrets.WALLET_SEED }}
          FORCE_DEPLOY: ${{ github.event.inputs.force_deploy || 'true' }}

      - name: Save Wallet Database Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.midnight
            preprod-deployment/cli/veilcred-private-state
            preprod-deployment/cli/wallet-state
            preprod-deployment/cli/level
            preprod-deployment/cli/.level
          key: ${{ runner.os }}-midnight-wallet-${{ github.run_id }}

      - name: Commit new deployed_contract.json to repo
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/deployed_contract.json deployed_contract.json || true
          git commit -m "chore: update deployed_contract.json with new v9 contract address" || echo "No changes"
          git push || echo "Push skipped"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Display Deployment Results
        if: always()
        run: |
          if [ -f deployed_contract.json ]; then
            echo "::notice title=Midnight Preprod Deployment::$(cat deployed_contract.json)"
            cat deployed_contract.json
          fi

      - name: Upload Deployment Info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info
          path: |
            preprod-deployment/cli/deployment.json
            deployed_contract.json
